name: Agent validation

on:
  push:
    branches: [main, 'feature/agent-interface-*']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/build.ps1'
      - 'UnpackVision.slnx'
      - '.github/workflows/agent-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test desktop solution
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release
      - name: Publish standalone agent
        shell: pwsh
        run: |
          dotnet publish ./src/UnpackVision.Agent/UnpackVision.Agent.csproj -c Release -r win-x64 --self-contained true -o artifacts/agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md artifacts/agent/
          New-Item -ItemType Directory -Path artifacts/agent/LICENSES -Force | Out-Null
          Copy-Item licenses/modelcontextprotocol/2.4.0/LICENSE-Apache-2.0.txt,licenses/system-commandline/2.0.15/LICENSE-MIT.txt artifacts/agent/LICENSES/
      - name: Check self-contained desktop host dependencies
        shell: pwsh
        run: |
          dotnet publish ./src/UnpackVision.App/UnpackVision.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/desktop-host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in @('Microsoft.AspNetCore.Server.Kestrel.Core.dll', 'UnpackVision.Agent.Shared.dll', 'UnpackVision.Application.dll')) {
            if (-not (Test-Path (Join-Path 'artifacts/desktop-host' $file))) { throw "Missing desktop dependency: $file" }
          }
      - name: Exercise published CLI and MCP processes
        shell: pwsh
        run: |
          $env:UNPACKVISION_AGENT_EXE = Join-Path $PWD 'artifacts/agent/UnpackVision.Agent.exe'
          dotnet test ./tests/UnpackVision.Tests/UnpackVision.Tests.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~AgentProcessE2ETests
          exit $LASTEXITCODE
      - name: Preserve validated agent
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-win-x64-${{ github.sha }}
          path: artifacts/agent/
          if-no-files-found: error
          retention-days: 7
